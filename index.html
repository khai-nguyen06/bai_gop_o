<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f9f9f9;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Danh sách sản phẩm</h1>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên sản phẩm</th>
                <th>Giá (VND)</th>
                <th>Số lượng</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Laptop Dell XPS 13</td>
                <td>25,000,000</td>
                <td>10</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Điện thoại iPhone 15 Pro</td>
                <td>28,990,000</td>
                <td>15</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Tai nghe Sony WH-1000XM5</td>
                <td>6,500,000</td>
                <td>20</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Bàn phím cơ Keychron K2</td>
                <td>1,850,000</td>
                <td>30</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Chuột Logitech MX Master 3S</td>
                <td>2,200,000</td>
                <td>25</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
